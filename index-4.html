<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BhuSetu — National Land Governance Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  try {
    const theme = localStorage.getItem('BhuSetu_theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  } catch(e) {}
</script>
<style>
:root{
  --navy-900:#1b2a41;
  --navy-800:#233550;
  --navy-700:#2b4060;
  --ivory-100:#f7f4ed;
  --ivory-200:#eee9dc;
  --ivory-300:#e3dbcc;
  --saffron-500:#c06c4b;
  --saffron-600:#a9593a;
  --saffron-100:#f8eadf;
  --ink-900:#252d3a;
  --ink-700:#4f5b6e;
  --ink-500:#7b889e;
  --line:#e3dbcc;
  --line-dark:#2c4363;
  --cream-text:#f2ede0;
  --good:#3f6b4a;
  --warn:#9c5a1e;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'IBM Plex Sans', -apple-system, sans-serif;
  --radius-s:3px;
  --radius-m:5px;
  --maxw:1180px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"] {
  --navy-900:#0a0e17;
  --navy-800:#111827;
  --navy-700:#1f2937;
  --ivory-100:#111827;
  --ivory-200:#1f2937;
  --ivory-300:#374151;
  --saffron-500:#f97316;
  --saffron-600:#ea580c;
  --saffron-100:#431407;
  --ink-900:#f3f4f6;
  --ink-700:#d1d5db;
  --ink-500:#9ca3af;
  --line:#374151;
  --line-dark:#4b5563;
  --cream-text:#f3f4f6;
}
[data-theme="dark"] .card { background: var(--navy-800); border-color: var(--line); }
[data-theme="dark"] .site-header { background: var(--navy-900); border-color: var(--line); }
[data-theme="dark"] .disclaimer-bar { background: var(--navy-800); border-color: var(--line); }
[data-theme="dark"] .announcement-ticker-wrap, [data-theme="dark"] .ticker-label { background: var(--navy-800); color: var(--cream-text); border-color: var(--line); }
[data-theme="dark"] .ticker-scroll { color: var(--ink-700); }
[data-theme="dark"] .btn-navy { background: var(--saffron-500); color: #000; border-color: var(--saffron-500); }
[data-theme="dark"] .btn-navy:hover { background: var(--saffron-600); }
[data-theme="dark"] .btn-outline { border-color: var(--cream-text); color: var(--cream-text); }
[data-theme="dark"] .cap-icon { background: var(--navy-700); color: var(--saffron-500); }
[data-theme="dark"] .brand-name { color: var(--cream-text); }
[data-theme="dark"] .lang-btn, [data-theme="dark"] .help-btn, [data-theme="dark"] .theme-btn { color: var(--ink-700); }
[data-theme="dark"] .lang-btn:hover, [data-theme="dark"] .help-btn:hover, [data-theme="dark"] .theme-btn:hover { color: var(--ink-900); }
[data-theme="dark"] .card h3 { color: var(--ink-900); }
[data-theme="dark"] .section h2 { color: var(--ink-900); }
[data-theme="dark"] .section-label { color: var(--saffron-500); }

/* Google Translate Fix */
body { top: 0px !important; }
.goog-te-banner-frame, .skiptranslate > iframe { display: none !important; }
.goog-te-gadget { color: transparent !important; }
#goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
.goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0;
  height:100%;
  font-family:var(--font-body);
  color:var(--ink-900);
  background:var(--ivory-100);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.container{max-width:var(--maxw);margin:0 auto;padding:0 28px}
@media (max-width:720px){.container{padding:0 18px}}

/* ---------- Header ---------- */
.site-header{
  background:var(--ivory-100);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
  padding-top:env(safe-area-inset-top,0px);
}
.header-row{display:flex;align-items:center;justify-content:space-between;height:68px;gap:24px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{
  width:34px;height:34px;border-radius:var(--radius-s);
  background:var(--navy-900);color:var(--saffron-500);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:16px;
}
.brand-text{line-height:1.15}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:0.2px}
.brand-name sup{font-size:9px;color:var(--saffron-600);font-family:var(--font-body);font-weight:700;margin-left:3px;border:1px solid var(--saffron-600);padding:1px 3px;border-radius:2px;vertical-align:2px}
.brand-sub{font-size:11px;color:var(--ink-500)}
.main-nav{display:flex;gap:2px;flex:1;justify-content:center;flex-wrap:wrap}
.main-nav a{
  font-size:14px;padding:8px 12px;border-radius:var(--radius-s);color:var(--ink-700);
  border-bottom:2px solid transparent;
}
.main-nav a:hover{color:var(--ink-900);background:var(--ivory-200)}
.main-nav a.active{color:var(--navy-900);border-bottom-color:var(--saffron-500);font-weight:600}
.header-actions{display:flex;align-items:center;gap:14px;flex-shrink:0}
.lang-btn,.help-btn{font-size:13px;color:var(--ink-700);background:none;border:none;display:flex;align-items:center;gap:5px;padding:6px}
.lang-btn:hover,.help-btn:hover{color:var(--ink-900)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:var(--radius-s);border:1px solid transparent;
  font-size:14px;font-weight:600;line-height:1;white-space:nowrap;
}
.btn-saffron{background:var(--saffron-500);color:#251505}
.btn-saffron:hover{background:var(--saffron-600)}
.btn-navy{background:var(--navy-900);color:var(--cream-text);border-color:var(--navy-900)}
.btn-navy:hover{background:var(--navy-700)}
.btn-outline{background:transparent;border-color:var(--ink-900);color:var(--ink-900)}
.btn-outline:hover{background:var(--ink-900);color:var(--ivory-100)}
.btn-outline-cream{background:transparent;border-color:rgba(242,237,224,0.5);color:var(--cream-text)}
.btn-outline-cream:hover{background:rgba(242,237,224,0.12)}
.btn-ghost{background:transparent;color:var(--ink-700);padding:9px 10px}
.btn-ghost:hover{color:var(--ink-900)}
.btn-sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.role-pill{display:flex;align-items:center;gap:8px;background:var(--ivory-200);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;font-size:13px}
.role-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--saffron-500)}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(180deg,var(--navy-900) 0%, var(--navy-800) 65%, var(--navy-700) 100%);color:var(--cream-text);padding:76px 0 96px}
.eyebrow{font-size:12.5px;letter-spacing:0.14em;color:var(--saffron-500);font-weight:600;margin-bottom:22px}
.hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(32px,4.4vw,54px);line-height:1.12;margin:0 0 22px;max-width:800px;letter-spacing:-0.01em}
.hero p{font-size:17px;color:#c9d2df;max-width:620px;margin:0 0 34px;line-height:1.6}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.hero-links{display:flex;gap:22px;font-size:13.5px}
.hero-links a{color:#b9c3d3;border-bottom:1px solid rgba(185,195,211,0.4);padding-bottom:2px}
.hero-links a:hover{color:var(--cream-text);border-color:var(--cream-text)}

/* ---------- Hero Slider ---------- */
.hero-slider-wrap { position: relative; overflow: hidden; width: 100%; min-height: 540px; background: var(--navy-900); }
.hero-slider { display: flex; width: 400%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
.hero-slide { width: 25%; min-height: 540px; background-size: cover; background-position: center; display: flex; align-items: center; }
.hero-slide-content { opacity: 0; transform: translateY(15px); transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s; }
.hero-slide.active-slide .hero-slide-content { opacity: 1; transform: translateY(0); }
.hero-slide .eyebrow { font-size:12.5px;font-weight:600;letter-spacing:0.1em;color:var(--saffron-500);margin-bottom:18px }
.hero-slide h1 { font-family:var(--font-display);font-size:clamp(32px,4vw,46px);font-weight:600;margin:0 0 16px;line-height:1.15;max-width:760px;color:var(--cream-text); text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
.hero-slide p { font-size:17.5px;line-height:1.6;color:#e2e8f0;max-width:620px;margin:0 0 32px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; z-index: 10; transition: background 0.2s, transform 0.2s; backdrop-filter: blur(4px); }
.slider-arrow:hover { background: rgba(0,0,0,0.7); transform: translateY(-50%) scale(1.05); }
.slider-prev { left: 32px; }
.slider-next { right: 32px; }
.slider-dots { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
.slider-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.slider-dot.active { background: var(--saffron-500); width: 28px; border-radius: 4px; }
@media (max-width:768px) { .slider-prev, .slider-next { display: none; } .hero-slide h1 { font-size: 28px; } }

/* ---------- Ticker ---------- */
.announcement-ticker-wrap { background: var(--ivory-100); color: var(--ink-900); padding: 12px 0; border-bottom: 1px solid var(--line); }
.ticker-container { display: flex; align-items: center; white-space: nowrap; width: 100%; overflow: hidden; position: relative; }
.ticker-label { font-size: 14px; font-weight: 700; margin-right: 16px; flex-shrink: 0; z-index: 2; padding-right: 16px; display: flex; align-items: center; background: var(--ivory-100); border-right: 1px solid var(--line); }
.ticker-scroll { font-size: 14px; font-weight: 500; padding-top: 2px; color: var(--ink-700); }/* ---------- Sections ---------- */
.section{padding:72px 0}
.section-ivory{background:var(--ivory-100)}
.section-ivory-alt{background:var(--ivory-200)}
.section-navy{background:var(--navy-900);color:var(--cream-text)}
.section-head{max-width:640px;margin-bottom:44px}
.section-label{font-size:12.5px;letter-spacing:0.1em;color:var(--saffron-600);font-weight:600;margin-bottom:12px}
.section-navy .section-label{color:var(--saffron-500)}
.section h2{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,2.6vw,34px);margin:0 0 14px;line-height:1.22}
.section-desc{color:var(--ink-700);font-size:15.5px;line-height:1.65}
.section-navy .section-desc{color:#c9d2df}

.grid{display:grid;gap:20px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:920px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.card{background:#fff;border:1px solid #e8e3d6;border-radius:8px;padding:32px;box-shadow:0 4px 16px rgba(0,0,0,0.03);transition:transform 0.2s,box-shadow 0.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.06)}
.card-flat{background:var(--ivory-100);border:1px solid var(--line);border-radius:8px;padding:28px}
.cap-icon{width:48px;height:48px;border-radius:50%;background:var(--ivory-200);color:var(--navy-900);display:flex;align-items:center;justify-content:center;margin-bottom:20px;font-size:22px}
.card h3{font-family:var(--font-display);font-size:21px;font-weight:600;margin:0 0 10px;color:var(--navy-900)}
.card p{font-size:14.5px;color:var(--ink-700);margin:0 0 20px;line-height:1.6}
.card-link{font-size:14px;font-weight:600;color:var(--saffron-500);display:inline-flex;align-items:center;gap:6px}
.card-link:hover{color:var(--saffron-600)}

/* workflow */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:6px}
.flow-step{flex:1;min-width:150px;padding:22px 20px;border-right:1px solid var(--line-dark)}
.flow-step:last-child{border-right:none}
.flow-num{font-family:var(--font-display);font-size:13px;color:var(--saffron-500);margin-bottom:10px;font-weight:600}
.flow-step h4{margin:0 0 8px;font-size:15.5px;font-weight:600}
.flow-step p{margin:0;font-size:13px;color:#aeb8c7;line-height:1.5}

/* evidence chain */
.chain{display:flex;flex-direction:column;max-width:420px;margin:0 auto}
.chain-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 18px;font-size:14px;font-weight:600;text-align:center}
.chain-arrow{text-align:center;color:var(--saffron-600);font-size:16px;padding:4px 0}
.demo-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:0.06em;background:var(--saffron-100);color:var(--saffron-600);padding:2px 7px;border-radius:3px;margin-left:8px;vertical-align:2px}

/* footer */
.site-footer{background:var(--navy-900);color:#9aa6ba;padding:52px 0 30px;font-size:13.5px}
.footer-grid{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:32px;margin-bottom:40px}
@media (max-width:820px){.footer-grid{grid-template-columns:repeat(2,1fr)}}
.footer-grid h5{color:var(--cream-text);font-size:13px;margin:0 0 14px;font-weight:600}
.footer-grid a{display:block;color:#9aa6ba;margin-bottom:9px}
.footer-grid a:hover{color:var(--cream-text)}
.footer-bottom{border-top:1px solid var(--line-dark);padding-top:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* ---------- Sign-in ---------- */
.signin-wrap{padding:64px 0 90px}
.signin-head{text-align:left;max-width:560px;margin-bottom:40px}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.role-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.role-grid{grid-template-columns:1fr}}
.role-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);padding:24px;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.role-card:hover{border-color:var(--saffron-500);box-shadow:0 2px 0 var(--saffron-500)}
.role-card h3{font-family:var(--font-display);font-size:18px;margin:14px 0 8px}
.role-card p{font-size:13.5px;color:var(--ink-700);flex:1;margin:0 0 18px;line-height:1.5}

/* ---------- Dashboard layout ---------- */
.dash-shell{display:flex;min-height:calc(100vh - 68px);align-items:flex-start}
.dash-sidebar{width:250px;flex-shrink:0;background:var(--ivory-200);border-right:1px solid var(--line);padding:24px 0;position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto}
.dash-role-tag{padding:0 20px 18px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.dash-role-tag .kicker{font-size:11px;letter-spacing:0.08em;color:var(--ink-500);font-weight:600}
.dash-role-tag .name{font-family:var(--font-display);font-weight:600;font-size:16px;margin-top:3px}
.dash-nav a{display:block;padding:9px 20px;font-size:13.5px;color:var(--ink-700);border-left:3px solid transparent}
.dash-nav a:hover{background:var(--ivory-300);color:var(--ink-900)}
.dash-nav a.active{background:#fff;border-left-color:var(--saffron-500);color:var(--navy-900);font-weight:600}
.dash-main{flex:1;min-width:0;padding:36px 40px 80px}
@media (max-width:900px){.dash-shell{flex-direction:column}.dash-sidebar{width:100%;position:static;height:auto;display:flex;overflow-x:auto;padding:12px 0}.dash-nav{display:flex}.dash-nav a{white-space:nowrap;border-left:none;border-bottom:3px solid transparent}.dash-nav a.active{border-left:none;border-bottom-color:var(--saffron-500)}.dash-role-tag{display:none}.dash-main{padding:24px 18px 60px}}

.page-head{margin-bottom:28px}
.page-head .kicker{font-size:12px;letter-spacing:0.08em;color:var(--saffron-600);font-weight:700;margin-bottom:8px}
.page-head h1{font-family:var(--font-display);font-size:clamp(22px,2.4vw,30px);margin:0 0 10px}
.page-head p{color:var(--ink-700);font-size:14.5px;max-width:640px;margin:0}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:36px}
@media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);padding:18px 20px}
.stat-card .num{font-family:var(--font-display);font-size:28px;font-weight:600;color:var(--navy-900)}
.stat-card .lbl{font-size:12.5px;color:var(--ink-500);margin-top:4px}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);padding:26px;margin-bottom:22px}
.panel h3{font-family:var(--font-display);font-size:17px;margin:0 0 4px}
.panel-sub{font-size:13px;color:var(--ink-500);margin:0 0 18px}

/* search / filters */
.search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-input{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-s);background:#fff;font-size:14px}
.search-input:focus{outline:2px solid var(--saffron-500);outline-offset:1px}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filter-row select{padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius-s);background:#fff;color:var(--ink-700)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 14px;font-size:13.5px;color:var(--ink-700);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--navy-900);border-bottom-color:var(--saffron-500);font-weight:600}
.tab:hover{color:var(--ink-900)}

.res-list{display:flex;flex-direction:column;gap:12px}
.res-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);padding:18px 20px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
.res-main{flex:1;min-width:240px}
.res-type{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--navy-900);background:var(--ivory-200);border:1px solid var(--line);padding:2px 8px;border-radius:3px;margin-bottom:8px}
.res-title{font-weight:600;font-size:15px;margin-bottom:5px}
.res-title a:hover{color:var(--saffron-600)}
.res-meta{font-size:12.5px;color:var(--ink-500)}
.res-meta span{margin-right:12px}
.res-actions{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.res-summary{font-size:13.5px;color:var(--ink-700);margin-top:8px;max-width:640px}

.icon-btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius-s);padding:6px 11px;font-size:12.5px;color:var(--ink-700);display:inline-flex;align-items:center;gap:5px}
.icon-btn:hover{border-color:var(--ink-900);color:var(--ink-900)}
.icon-btn.active{background:var(--saffron-100);border-color:var(--saffron-500);color:var(--saffron-600)}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-500)}
.empty-state h3{font-family:var(--font-display);color:var(--ink-900);margin-bottom:8px}

/* forms */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-900)}
.field input[type=text],.field input[type=email],.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:#fff}
.field textarea{resize:vertical;min-height:90px}
.field-hint{font-size:12px;color:var(--ink-500);margin-top:5px}

/* slider */
.slider-row{margin-bottom:22px}
.slider-row .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px}
.slider-row .top .val{font-weight:700;color:var(--saffron-600)}
input[type=range]{width:100%;accent-color:var(--saffron-500)}

/* bar chart (svg-free, css based) */
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:60%;border-radius:3px 3px 0 0;transition:height .3s}
.bar-cur{background:#9aa6ba}
.bar-a{background:var(--saffron-500)}
.bar-b{background:var(--navy-700)}
.bar-col .bv{font-size:11.5px;font-weight:700;margin-bottom:5px}
.bar-col .bl{font-size:11px;color:var(--ink-500);margin-top:8px;text-align:center}
.legend-row{display:flex;gap:18px;font-size:12.5px;color:var(--ink-700);margin-top:8px}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block}

/* GIS demo map */
.gis-layout{display:grid;grid-template-columns:230px 1fr 240px;gap:0;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden}
@media (max-width:1000px){.gis-layout{grid-template-columns:1fr;}}
.gis-panel{padding:18px;background:#fff}
.gis-panel + .gis-panel{border-left:1px solid var(--line)}
.gis-panel h4{font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-500);margin:0 0 12px}
.layer-item{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:6px 0}
.map-canvas{background:var(--navy-900);min-height:440px;position:relative;display:flex;align-items:center;justify-content:center;padding:20px}
.state-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:460px;width:100%}
.state-cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#0c1626;font-weight:700;text-align:center;padding:2px;cursor:pointer;border:2px solid transparent}
.state-cell:hover{border-color:#fff}
.state-cell.selected{border-color:var(--saffron-500);box-shadow:0 0 0 2px rgba(221,138,52,0.4)}
.map-legend{position:absolute;bottom:14px;left:14px;background:rgba(12,22,38,0.85);border:1px solid var(--line-dark);border-radius:4px;padding:10px 12px;color:#dfe4ec;font-size:11.5px}
.map-legend .lg-row{display:flex;align-items:center;gap:7px;margin:3px 0}
.map-legend .lg-swatch{width:10px;height:10px;border-radius:2px}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(12,18,28,0.5);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;z-index:200;overflow-y:auto}
.modal{background:#fff;border-radius:var(--radius-m);max-width:640px;width:100%;padding:32px;position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:18px;color:var(--ink-500);width:30px;height:30px;border-radius:50%}
.modal-close:hover{background:var(--ivory-200);color:var(--ink-900)}
.modal h2{font-family:var(--font-display);font-size:21px;margin:0 0 16px}
.modal-scroll{max-height:60vh;overflow-y:auto}
table.data-table{width:100%;border-collapse:collapse;font-size:12.5px}
table.data-table th,table.data-table td{border:1px solid var(--line);padding:7px 9px;text-align:left}
table.data-table th{background:var(--ivory-200)}

#toast-wrap{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--navy-900);color:var(--cream-text);padding:13px 18px;border-radius:var(--radius-s);font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,0.2);border-left:3px solid var(--saffron-500);max-width:320px;animation:toastin .18s ease-out}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

.divider{height:1px;background:var(--line);margin:28px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--ivory-200);color:var(--ink-700);border:1px solid var(--line)}
.badge-good{background:#e6efe8;color:var(--good);border-color:#c7ddcc}
.badge-warn{background:#f6e9d8;color:var(--warn);border-color:#ecd3ac}
.kv-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:13.5px;margin:16px 0}
.kv-list .k{color:var(--ink-500);font-size:12px}
.kv-list .v{font-weight:600}
.two-col{display:grid;grid-template-columns:2fr 1fr;gap:26px}
@media (max-width:900px){.two-col{grid-template-columns:1fr}}
.text-block h3{font-family:var(--font-display);font-size:16.5px;margin:22px 0 8px}
.text-block h3:first-child{margin-top:0}
.text-block p{font-size:14px;color:var(--ink-700);line-height:1.65;margin:0 0 6px}
.link-list a{display:block;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.link-list a:last-child{border-bottom:none}
.compare-bar{position:fixed;bottom:0;left:0;right:0;background:var(--navy-900);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;z-index:150;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);padding:5px 10px;border-radius:14px;font-size:12.5px;margin-right:8px}
.chip button{background:none;border:none;color:#fff;font-size:14px;line-height:1}
.skeleton-note{font-size:12px;color:var(--ink-500);font-style:italic}
::selection{background:var(--saffron-100)}
:focus-visible{outline:2px solid var(--saffron-500);outline-offset:2px}

<script>
/* =========================================================
   BhuSetu — National Land Governance Platform (demo build)
   Single-file SPA. All data below is illustrative/demo data.
========================================================= */

/* ---------- persistent state ---------- */
const LS_KEY = 'BhuSetu_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {role:null, roleLabel:null, saved:[], submissions:[], collabRequests:[], researchRequests:[], lang:'en'};
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();

/* ---------- toast ---------- */
function toast(msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ---------- demo data ---------- */
const STATES = ["Telangana","Andhra Pradesh","Maharashtra","Karnataka","Tamil Nadu","Uttar Pradesh","Madhya Pradesh","Rajasthan","Gujarat","West Bengal","Bihar","Odisha","Punjab","Haryana","Kerala"];
const TOPICS = ["Agricultural Land Conversion","Urban Expansion","Forest Cover Change","Land Titling","Water Resource Management","Climate Vulnerability","Land Tenure Security","Infrastructure Development","Common Property Resources","Land Records Digitization"];
const INSTITUTIONS = ["National Institute of Rural Development","Indian Statistical Institute","Centre for Policy Research","IIT Hyderabad — CSRE","NRSC Hyderabad","Council for Social Development","Gokhale Institute of Politics & Economics"];
const AUTHORS = ["A. Krishnamurthy","S. Bhattacharya","M. Rao","P. Iyer","R. Sharma","N. Fernandes","D. Chatterjee","K. Reddy"];

function pick(arr,i){ return arr[i % arr.length]; }
function seedRand(seed){ let x = Math.sin(seed)*10000; return x - Math.floor(x); }

const TYPE_LABELS = {
  paper:"Research Paper", dataset:"Dataset", report:"Government Report", law:"Land Law",
  judgment:"Judgment", 'case-study':"Case Study", 'gis-layer':"GIS Layer", policy:"Policy",
  grant:"Research Grant", programme:"Programme", 'decision-brief':"Decision Brief",
  collab:"Collaboration", project:"Project", challenge:"Innovation Challenge"
};

const RESOURCES = [];
(function buildResources(){
  let id=1;
  const types = ['paper','dataset','report','law','judgment','gis-layer','grant','programme','decision-brief','collab','project'];
  for(let i=0;i<66;i++){
    const type = pick(types,i);
    const state_ = pick(STATES,i*3+1);
    const topic = pick(TOPICS,i*2+1);
    const year = 2015 + Math.floor(seedRand(i+1)*11);
    const inst = pick(INSTITUTIONS,i+2);
    const author = pick(AUTHORS,i+4);
    let title;
    if(type==='paper') title = `${topic} in ${state_}: evidence from district-level panel data`;
    else if(type==='dataset') title = `${state_} ${topic} dataset, ${year}`;
    else if(type==='report') title = `Annual report on ${topic.toLowerCase()} — ${state_} (${year})`;
    else if(type==='law') title = `${state_} Land Revenue & Tenancy (Amendment) Act, ${year}`;
    else if(type==='judgment') title = `High Court of ${state_} — land classification dispute, ${year}`;
    else if(type==='gis-layer') title = `${topic} spatial layer — ${state_}, ${year}`;
    else if(type==='grant') title = `Research grant: ${topic} in ${state_}`;
    else if(type==='programme') title = `${state_} ${topic} Monitoring Programme`;
    else if(type==='decision-brief') title = `Decision brief: policy options for ${topic.toLowerCase()} in ${state_}`;
    else if(type==='collab') title = `Collaboration opportunity — ${topic} research network`;
    else title = `Pilot project: ${topic.toLowerCase()} intervention in ${state_}`;
    RESOURCES.push({
      id:'RES-'+(id++), type, title, state:state_, district:`${state_.split(' ')[0]} District ${1+(i%9)}`,
      year, topic, institution:inst, author,
      summary:`Illustrative demo record examining ${topic.toLowerCase()} patterns in ${state_}, compiled for platform demonstration purposes.`,
      source: type==='law'||type==='judgment' ? `${state_} Gazette / Judiciary records` : inst,
      method: type==='dataset'||type==='gis-layer' ? 'Remote sensing + field verification (demo)' : 'Mixed-methods analysis (demo)',
      lastUpdated:`${year}-${String(1+(i%12)).padStart(2,'0')}-${String(1+(i%27)).padStart(2,'0')}`
    });
  }
})();

const CASE_STUDIES = [

   problem:'Manual land records led to frequent boundary disputes and long resolution times in revenue courts.',
   background:'Prior to reform, land ownership records were paper-based across mandal offices, with duplicate and conflicting entries common in older revenue divisions.',
   intervention:'A state-wide digitisation drive linked survey records, registration data and mutation records into a single searchable ledger.',

   outcomes:'Illustrative demo figures show a reduction in new title-dispute filings and faster average resolution time for existing cases.',
   challenges:'Resurveying contested plots and reconciling legacy paper records with GPS-verified boundaries required significant field verification effort.',

   background:'Historic settlement patterns predated modern coastal hazard mapping, leaving many habitations in high-exposure zones.',
   intervention:'Updated coastal vulnerability mapping informed a revised land-use and resettlement-incentive framework.',
   data:'Storm surge modelling, elevation data and settlement census overlays (demo).',
   implementation:'Phased rollout prioritising the highest-vulnerability gram panchayats first.',
   outcomes:'Demo tracking shows increased uptake of resilient housing incentives in mapped high-risk zones.',
   challenges:'Balancing resettlement incentives with communities\u2019 livelihood ties to the coastline required extended consultation.',
   lessons:'Early, visible GIS evidence sharing with panchayats improved trust in the vulnerability classification.',

  state:s,

/* ---------- router ---------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  const parts = h.split('/').filter(Boolean).map(decodeURIComponent);
  return parts;
}
function go(path){ location.hash = path; }

window.addEventListener('hashchange', render);

/* ---------- shared header/footer ---------- */

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openModal(innerHtml){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.id='modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <button class="modal-close" data-action="close-modal">\u00D7</button>
    <div class="modal-scroll">${innerHtml}</div>
  </div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}

window.currentCaptcha = '';
window.refreshCaptcha = function() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let str = '';
  for(let i=0; i<5; i++) str += chars.charAt(Math.floor(Math.random() * chars.length));
  window.currentCaptcha = str;
  const box = document.getElementById('captchaBox');
  if(box) box.innerText = str;
};

window.requestOtp = function() {
  let mobile = document.getElementById('loginMobile').value.trim();
  const captcha = document.getElementById('loginCaptcha').value.trim();
  const role = document.querySelector('input[name="loginRole"]:checked').value;

  if(!mobile) { toast('Please enter a mobile number'); return; }
  if(captcha.toUpperCase() !== window.currentCaptcha) { toast('Invalid Captcha. Please try again.'); refreshCaptcha(); return; }

  // Auto-prepend +91 for Indian numbers if not present, required for some APIs
  if(mobile.length === 10 && !mobile.startsWith('+')) {
    mobile = '+91' + mobile;
  }

  const generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
  toast('Sending real SMS to ' + mobile + '...');
  
  const fast2smsKey = localStorage.getItem('fast2sms_key');

  if (fast2smsKey) {
    // Use Fast2SMS if key is provided
    const cleanNumber = mobile.replace('+91', '');
    fetch(`https://www.fast2sms.com/dev/bulkV2?authorization=${fast2smsKey}&route=q&message=Your BhuSetu login OTP is: ${generatedOtp}&language=english&flash=0&numbers=${cleanNumber}`)
      .then(res => res.json()).then(data => {
        console.log("Fast2SMS Response:", data);
        showOtpModal(role, mobile, generatedOtp);
      }).catch(err => {
        console.error(err);
        showOtpModal(role, mobile, generatedOtp);
      });
  } else {
    // Fallback to textbelt
    fetch('https://textbelt.com/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: mobile,
        message: 'Your BhuSetu login OTP is: ' + generatedOtp,
        key: 'textbelt'
      })
    }).then(res => res.json()).then(data => {
      console.log("Textbelt Response:", data);
      showOtpModal(role, mobile, generatedOtp);
    }).catch(err => {
      console.error(err);
      showOtpModal(role, mobile, generatedOtp);
    });
  }
};

  let mobile = document.getElementById('signupMobile').value.trim();
  const role = document.getElementById('signupRole').value;
  
  if(!mobile) { toast('Please enter a mobile number'); return; }
  
  if(mobile.length === 10 && !mobile.startsWith('+')) {
    mobile = '+91' + mobile;
  }
  
  const generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
  toast('Sending real SMS to ' + mobile + '...');
  
  const fast2smsKey = localStorage.getItem('fast2sms_key');

  if (fast2smsKey) {
    const cleanNumber = mobile.replace('+91', '');
    fetch(`https://www.fast2sms.com/dev/bulkV2?authorization=${fast2smsKey}&route=q&message=Your BhuSetu login OTP is: ${generatedOtp}&language=english&flash=0&numbers=${cleanNumber}`)
      .then(res => res.json()).then(data => {
        showOtpModal(role, mobile, generatedOtp);
      }).catch(err => {
        showOtpModal(role, mobile, generatedOtp);
      });
  } else {
    fetch('https://textbelt.com/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: mobile,
        message: 'Your BhuSetu login OTP is: ' + generatedOtp,
        key: 'textbelt'
      })
    }).then(res => res.json()).then(data => {
      showOtpModal(role, mobile, generatedOtp);
    }).catch(err => {
      showOtpModal(role, mobile, generatedOtp);
    });
  }
};

window.showOtpModal = function(role, mobile, generatedOtp) {
  const isKeySetup = !!localStorage.getItem('fast2sms_key');
  const helperText = isKeySetup 
    ? `<span style="color:green; font-weight:bold;">REAL SMS SENT VIA FAST2SMS! Check your mobile phone.</span>`
    : `<span style="color:var(--saffron-600); font-weight:bold;">SMS API Quota Exceeded. Enter this Simulated OTP to login: <span style="background:var(--ivory-200); padding:2px 6px; border:1px solid var(--line);">${generatedOtp}</span></span>`;

  openModal(`
    <h2>Enter OTP</h2>
    <p style="color:var(--ink-700); font-size:14px; margin-bottom:20px;">We have sent a 4-digit OTP to <b>${escapeHtml(mobile)}</b>.<br><br>${helperText}</p>
    <div style="margin-bottom:24px;">
      <input type="text" id="otpInput" placeholder="Enter 4-digit code" maxlength="4" style="width:100%; padding:12px; border:1px solid var(--line); border-radius:6px; font-size:18px; text-align:center; letter-spacing:8px;">

    <button class="btn btn-navy" style="width:100%; padding:14px;" onclick="verifyOtp('${role}', '${generatedOtp}')">Verify & Login</button>

};

window.verifyOtp = function(role, expectedOtp) {
  const code = document.getElementById('otpInput').value;
  if(code === expectedOtp) {
    closeModal();
    toast('Login successful!');
    go('/dash/' + role + '/overview');
  } else {

function pageDashboard(role, section){

  const navHtml = navConf.map(n=>`<a href="#/dash/${role}/${n.id}" class="${n.id===active.id?'active':''}">${n.label}</a>`).join('');

function renderDashSection(role, item){
  switch(item.kind){
    case 'overview': return dashOverview(role);
    case 'list': return listSection(item.label, `Illustrative demo records relevant to ${item.label.toLowerCase()}.`, item.filter, role, item.id);
    case 'saved': return savedSection();
    case 'collab': return collabSection();
    case 'requests': return requestsSection();
    case 'submissions': return submissionsSection();
    case 'challenges': return challengesSection(role);
    case 'apis': return apisSection();
    case 'ai': return aiAssistantSection(true);
    case 'gapfinder': return gapFinderSection();
    case 'analysis': return analysisSection();
    case 'cases': return caseStudiesSection(true, role);
    case 'ideas': return ideasSection();
    case 'methodology': return methodologySection();
    case 'evidence': return evidenceSection(true);
    case 'policies': return policiesSection(role);
    case 'policycompare': return policyCompareSection();
    case 'simulator': return simulatorSection();
    case 'gis': return gisSection(true);
    case 'districts': return districtsSection();
    default: return `<div class="empty-state"><h3>Section unavailable</h3></div>`;
  }

  const savedCount = state.saved.length;

  else if(role==='policymaker') stats=[['Active Policies',POLICIES.filter(p=>p.status==='Active').length],['Pilots Running',POLICIES.filter(p=>p.status==='Pilot').length],['Decision Briefs',RESOURCES.filter(r=>r.type==='decision-brief').length],['Districts Tracked',STATES.length]];

function runAiQuery(q){
  const ql = q.toLowerCase();
  const words = ql.split(/\s+/).filter(w=>w.length>2);
  function scoreMatch(r){
    const hay = `${r.title} ${r.state} ${r.topic}`.toLowerCase();
    return words.reduce((s,w)=> s + (hay.includes(w)?1:0), 0);
  }
  const scored = RESOURCES.map(r=>({r,score:scoreMatch(r)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  const byType = {};
  scored.forEach(({r})=>{ (byType[r.type]=byType[r.type]||[]).push(r); });
  
  const papers = (byType['paper']||[]).slice(0,3);
  const datasets = (byType['dataset']||[]).slice(0,3);
  
  let html = `<div class="panel">
    <h3>AI-Assisted Literature Review</h3>
    <p class="panel-sub" style="margin-bottom:24px;">Generated synthesis for: <b>\u201c${escapeHtml(q)}\u201d</b> <span class="demo-tag" style="background:#fef3c7; color:#92400e;">AI-ASSISTED</span></p>
    
    <div style="background:var(--ivory-100); padding:20px; border-radius:8px; border:1px solid var(--line); margin-bottom:24px;">
      <h4 style="font-size:14px; margin-bottom:8px; color:var(--navy-900);">Key Themes</h4>
      <ul style="font-size:14px; color:var(--ink-700); margin-bottom:16px; padding-left:20px;">
        <li>Accelerated conversion of multi-cropped agricultural land for infrastructure.</li>
        <li>Increasing fragmentation of remaining marginal farmholdings.</li>
      </ul>
      
      <h4 style="font-size:14px; margin-bottom:8px; color:var(--navy-900);">Research Methods Used</h4>
      <p style="font-size:14px; color:var(--ink-700); margin-bottom:16px;">Most literature employs mixed-methods, combining <b>Remote Sensing Change Detection (NDVI)</b> with <b>Panel Data Analysis</b> of socio-economic surveys.</p>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:16px;">
        <div>
          <h4 style="font-size:14px; margin-bottom:8px; color:var(--navy-900);">Common Findings</h4>
          <p style="font-size:14px; color:var(--ink-700);">Urban expansion strictly correlates with agricultural displacement within a 50km radius of major tier-1 and tier-2 cities.</p>
        </div>
        <div>
          <h4 style="font-size:14px; margin-bottom:8px; color:var(--navy-900);">Contrasting Findings</h4>
          <p style="font-size:14px; color:var(--ink-700);">Debate exists on whether compensation mechanisms adequately restore livelihood; some studies show long-term income gains while others show permanent agrarian distress.</p>
        </div>
      </div>
      
      <h4 style="font-size:14px; margin-bottom:8px; color:var(--navy-900);">Potential Research Gaps</h4>
      <p style="font-size:14px; color:var(--ink-700); margin-bottom:0;">Lack of longitudinal studies on the secondary effects of land-use change on female agricultural laborers and localized micro-climate impacts.</p>
    </div>
  `;
  
  if (papers.length > 0) {
    html += `<h4 style="font-size:13px;margin:18px 0 12px;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.05em">Relevant Literature (${papers.length})</h4>`;
    html += resList(papers);
  }
  if (datasets.length > 0) {
    html += `<h4 style="font-size:13px;margin:32px 0 12px;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.05em">Related Datasets (${datasets.length})</h4>`;
    html += resList(datasets);
  }
  
  html += `</div>`;
  document.getElementById('ai-results').innerHTML = html;
}

function gapFinderSection(){
  return `

      </div>
      <button class="btn btn-saffron" type="submit">Analyse</button>
    </form>
  </div>
  <div id="gap-results"></div>`;

function runGapFinder(topic, geo, period){
  const seed = (topic.length*13 + geo.length*7 + period.length*3);
  const existing = 4 + Math.floor(seedRand(seed)*20);
  const concentration = STATES.slice(0,6).map((s,i)=>({s, v: Math.round(10+seedRand(seed+i)*90)}));
  const maxV = Math.max(...concentration.map(c=>c.v));
  const underResearched = STATES.filter((s,i)=> seedRand(seed+i+50) < 0.35).slice(0,4);
  const missingDatasets = ['Household-level panel data', 'Sub-district GIS boundary revisions', 'Longitudinal price/land-value series', 'Ground-truthed satellite validation samples'];
  const questions = [
    `How does ${topic.toLowerCase()} in ${geo} correlate with household income change over ${period.toLowerCase()}?`,
    `What is the causal effect of recent policy change on ${topic.toLowerCase()} in ${geo}?`,
    `Are under-researched districts in ${geo} systematically different in land tenure structure?`
  ];
  const html = `
  <div class="panel">
    <h3>Results: ${topic} \u2014 ${geo} \u2014 ${period}</h3>
    <div class="stat-grid" style="margin-top:16px">
      <div class="stat-card"><div class="num">${existing}</div><div class="lbl">Existing studies indexed</div></div>
      <div class="stat-card"><div class="num">${underResearched.length}</div><div class="lbl">Under-researched states</div></div>
      <div class="stat-card"><div class="num">${missingDatasets.length}</div><div class="lbl">Missing dataset types</div></div>
      <div class="stat-card"><div class="num">${questions.length}</div><div class="lbl">Suggested questions</div></div>
    </div>
    <h4 style="font-size:13px;margin:22px 0 8px;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.05em">Research concentration by state <span class="demo-tag">DEMO</span></h4>
    <div class="bars">
      ${concentration.map(c=>`<div class="bar-col"><div class="bv">${c.v}</div><div class="bar bar-cur" style="height:${(c.v/maxV*140)}px"></div><div class="bl">${c.s.split(' ')[0]}</div></div>`).join('')}
    </div>
    <div class="two-col" style="margin-top:26px">
      <div class="text-block">
        <h3>Under-researched areas</h3>
        <div class="link-list">${underResearched.map(s=>`<a href="#/research?state=${encodeURIComponent(s)}">${s}</a>`).join('')}</div>
        <h3>Missing datasets</h3>
        <p>${missingDatasets.join(' \u00B7 ')}</p>
      </div>
      <div class="text-block">
        <h3>Suggested research questions</h3>
        ${questions.map(q=>`<p>\u2022 ${q}</p>`).join('')}
        <h3>Suggested methodology</h3>
        <p>Mixed-methods panel design combining remote-sensing derived land-use change with household or plot-level survey data, using difference-in-differences around the relevant policy change.</p>
      </div>
    </div>
  </div>`;
  document.getElementById('gap-results').innerHTML = html;
}

      <div class="slider-row"><div class="top"><span>Afforestation investment</span><span class="val" id="v-forest">50%</span></div><input type="range" id="s-forest" min="0" max="100" value="50"></div>
    </div>

  </div>
  <div id="sim-results">${simChart(50,50,50)}</div>`;
}
function simChart(protect, urban, forest){
  const cur = {ag:42, forest:23, urban:14, water:55};
  const a = {
    ag: Math.max(5, Math.round(cur.ag + (protect-50)*0.3)),
    forest: Math.max(5, Math.round(cur.forest + (forest-50)*0.25 - (urban-50)*0.1)),
    urban: Math.max(2, Math.round(cur.urban + (urban-50)*0.3)),
    water: Math.max(5, Math.round(cur.water - (forest-50)*0.15 + (urban-50)*0.2))
  };
  const b = {
    ag: Math.max(5, Math.round(cur.ag + (protect-50)*0.5)),
    forest: Math.max(5, Math.round(cur.forest + (forest-50)*0.45 - (urban-50)*0.15)),
    urban: Math.max(2, Math.round(cur.urban + (urban-50)*0.15)),
    water: Math.max(5, Math.round(cur.water - (forest-50)*0.25 + (urban-50)*0.1))
  };
  const rows = [['Agricultural land (%)','ag'],['Forest cover (%)','forest'],['Urban area (%)','urban'],['Water stress index','water']];
  return `<div class="panel">
    <div class="legend-row"><span><span class="legend-dot" style="background:#9aa6ba"></span>Current</span><span><span class="legend-dot" style="background:var(--saffron-500)"></span>Scenario A (moderate)</span><span><span class="legend-dot" style="background:var(--navy-700)"></span>Scenario B (aggressive)</span></div>
    ${rows.map(([label,key])=>{
      const max = Math.max(cur[key],a[key],b[key],1)*1.15;
      return `<h4 style="font-size:12.5px;margin:20px 0 6px;color:var(--ink-500)">${label}</h4>
      <div class="bars" style="height:110px">
        <div class="bar-col"><div class="bv">${cur[key]}</div><div class="bar bar-cur" style="height:${cur[key]/max*90}px"></div><div class="bl">Current</div></div>
        <div class="bar-col"><div class="bv">${a[key]}</div><div class="bar bar-a" style="height:${a[key]/max*90}px"></div><div class="bl">Scenario A</div></div>
        <div class="bar-col"><div class="bv">${b[key]}</div><div class="bar bar-b" style="height:${b[key]/max*90}px"></div><div class="bl">Scenario B</div></div>
      </div>`;
    }).join('')}
    <p class="skeleton-note">Scenario/model output \u2014 not a guaranteed prediction.</p>
  </div>`;
}

function gisStateGrid(layerId, selected){
  return DISTRICT_STATS.map((d,i)=>{
    const v = layerId==='forest'?d.forestPct: layerId==='urban'? d.urbanGrowth*10 : layerId==='water'? (100-d.forestPct)/2 : layerId==='flood'? d.forestPct/1.5 : layerId==='climate'? d.forestPct/1.2 : d.agLandPct;
    const intensity = Math.min(1, v/90);
    const color = mixColor(intensity);
    return `<div class="state-cell ${selected===d.state?'selected':''}" style="background:${color}" data-action="gis-select" data-state="${d.state}">${d.state.split(' ').map(w=>w[0]).join('')}</div>`;
  }).join('');
}
function mixColor(t){
  const c1=[231,187,135], c2=[138,79,20];
  const r = Math.round(c1[0]+(c2[0]-c1[0])*t);
  const g = Math.round(c1[1]+(c2[1]-c1[1])*t);
  const b = Math.round(c1[2]+(c2[2]-c1[2])*t);
  return `rgb(${r},${g},${b})`;
}

  if(el) el.classList.add('selected');
}

function runResearchHub(){
  const q = (document.getElementById('rh-search').value||'').toLowerCase();
  const st = document.getElementById('rh-state').value;
  const tp = document.getElementById('rh-topic').value;
  const yr = document.getElementById('rh-year').value;
  const tab = document.querySelector('#rh-tabs .tab.active').dataset.tab;
  const tabMap = {'Research Papers':'paper','Datasets':'dataset','Government Reports':'report','Laws':'law','Judgments':'judgment','GIS Data':'gis-layer'};
  let items = RESOURCES.filter(r=>{
    if(st && r.state!==st) return false;
    if(tp && r.topic!==tp) return false;
    if(yr && String(r.year)!==yr) return false;
    if(q && !(r.title.toLowerCase().includes(q)||r.topic.toLowerCase().includes(q)||r.state.toLowerCase().includes(q))) return false;
    if(tabMap[tab] && r.type!==tabMap[tab]) return false;
    return true;
  });
  let extra = '';
  if(tab==='All' || tab==='Policies'){
    let pol = POLICIES.filter(p=> (!st||p.state===st) && (!tp||p.topic===tp) && (!q||p.name.toLowerCase().includes(q)));
    if(pol.length) extra += `<h4 style="font-size:13px;margin:20px 0 8px;color:var(--ink-500);text-transform:uppercase">Policies</h4>` + policyList(pol);
  }
  if(tab==='All' || tab==='Case Studies'){
    let cs = CASE_STUDIES.filter(c=> (!st||c.state===st) && (!tp||c.topic===tp) && (!q||c.title.toLowerCase().includes(q)));
    if(cs.length) extra += `<h4 style="font-size:13px;margin:20px 0 8px;color:var(--ink-500);text-transform:uppercase">Case Studies</h4>` + caseList(cs);
  }
  document.getElementById('rh-results').innerHTML = (items.length?resList(items):'') + extra + ((!items.length && !extra) ? emptyState('No results found','Try adjusting your search or filters.') : '');
}

function render(){
  closeModal();
  const parts = parseHash();
  const app = document.getElementById('app');
  let query = '';
  if(location.hash.includes('?')) query = location.hash.split('?')[1];
  let html;
  if(parts.length===0){ html = pageHome(); }
  else if(parts[0]==='signin'){ html = pageSignin(); }
  else if(parts[0]==='dash'){ html = pageDashboard(parts[1], (parts[2]||'').split('?')[0]); }
  else if(parts[0]==='research'){ html = pageResearch(query); }
  else if(parts[0]==='evidence'){ html = pageEvidence(); }
  else if(parts[0]==='policy-lab'){ html = pagePolicyLab(parts[1]); }
  else if(parts[0]==='gis'){ html = pageGis(); }
  else if(parts[0]==='data-hub'){ html = pageDataHub(query); }
  else if(parts[0]==='case-studies'){ html = pageCaseStudies(); }
  else if(parts[0]==='innovation'){ html = pageInnovation(); }
  else if(parts[0]==='about'){ html = pageAbout(); }
  else if(parts[0]==='manuals'){ html = pageManuals(); }
  else if(parts[0]==='faq'){ html = pageFaq(); }

  app.innerHTML = html;
  window.scrollTo(0,0);
  afterRender(parts);
}


function fetchVisitorCount() {
  const el = document.getElementById('visitorCountDisplay');
  if (!el) return;
  
  let isNewSession = !sessionStorage.getItem('bhusetu_session');
  let url = 'https://countapi.mileshilliard.com/api/v1/hit/bhusetu_visitor_count_prod_2026';
  
  if (!isNewSession) {
    url = 'https://countapi.mileshilliard.com/api/v1/get/bhusetu_visitor_count_prod_2026';
  } else {
    sessionStorage.setItem('bhusetu_session', '1');
  }

  fetch(url)
    .then(res => res.json())
    .then(data => {
      if (data && data.value) {
        el.innerText = data.value.toLocaleString();
      } else {
        el.innerText = 'Unavailable';
      }
    })
    .catch(err => {
      console.error('Visitor counter error:', err);
      el.innerText = 'Unavailable';
    });
}
function afterRender(parts){
  if(parts.length===0 || !parts[0]){ 
    initHeroSlider(); 
    fetchVisitorCount();
  }
  if(parts[0]==='signin'){ refreshCaptcha(); }
  if(parts[0]==='research'){ runResearchHub(); }
  if(parts[0]==='data-hub'){ runDataHub(); }
  if(parts[2]==='policy-simulator' || (parts[0]==='policy-lab' && (parts[1]==='simulator'||parts[1]==='sandbox'))){ bindSimulator(); }
  if(parts[2]==='gis' || parts[0]==='gis' || parts[2]==='explore-map'){ bindGis(); }
  if(parts[0]==='case-studies'){ bindCaseSearch(); }

  bindListSearches();
  bindEvidenceTabs();
}

let heroInterval;
function initHeroSlider(){
  const slider = document.getElementById('heroSlider');
  if(!slider) return;
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.slider-dot');
  const wrap = document.getElementById('heroWrap');
  let currentIndex = 0;
  const numSlides = slides.length;
  
  function goToSlide(index){
    if(index < 0) index = numSlides - 1;
    if(index >= numSlides) index = 0;
    currentIndex = index;
    slider.style.transform = `translateX(-${currentIndex * 25}%)`;
    slides.forEach(s=>s.classList.remove('active-slide'));
    slides[currentIndex].classList.add('active-slide');
    dots.forEach(d=>d.classList.remove('active'));
    dots[currentIndex].classList.add('active');
  }
  
  window.heroNext = () => goToSlide(currentIndex + 1);
  window.heroPrev = () => goToSlide(currentIndex - 1);
  window.heroDot = (idx) => goToSlide(idx);
  
  function startAutoPlay(){
    clearInterval(heroInterval);
    heroInterval = setInterval(window.heroNext, 5000);
  }
  
  wrap.addEventListener('mouseenter', ()=>clearInterval(heroInterval));
  wrap.addEventListener('mouseleave', startAutoPlay);
  
  startAutoPlay();
}

function bindSimulator(){
  const p = document.getElementById('s-protect'), u = document.getElementById('s-urban'), f = document.getElementById('s-forest');
  if(!p) return;
  const update=()=>{
    document.getElementById('v-protect').textContent = p.value+'%';
    document.getElementById('v-urban').textContent = u.value+'%';
    document.getElementById('v-forest').textContent = f.value+'%';
  };
  [p,u,f].forEach(el=>el.addEventListener('input', update));
}
function bindGis(){
  const grid = document.getElementById('state-grid');
  if(!grid) return;
  const timeSlider = document.getElementById('gis-time');
  if(timeSlider) timeSlider.addEventListener('input', ()=>{ document.getElementById('gis-time-label').textContent = timeSlider.value; });
  const search = document.getElementById('gis-search');
  if(search) search.addEventListener('input', ()=>{
    const q = search.value.toLowerCase();
    document.querySelectorAll('#state-grid .state-cell').forEach(c=>{
      c.style.opacity = c.dataset.state.toLowerCase().includes(q) ? '1':'0.25';
    });
  });
}
function bindCaseSearch(){
  const s = document.getElementById('case-search');
  if(!s) return;
  s.addEventListener('input', ()=>{
    const q = s.value.toLowerCase();
    const items = CASE_STUDIES.filter(c=> c.title.toLowerCase().includes(q) || c.state.toLowerCase().includes(q) || c.topic.toLowerCase().includes(q));
    document.getElementById('case-list').innerHTML = items.length? caseList(items) : emptyState('No case studies found','Try a different search term.');

function bindDataHubSearch(){
  const s = document.getElementById('dh-search');
  if(!s) return;
  s.addEventListener('input', ()=>{
    const q = s.value.toLowerCase();
    const items = RESOURCES.filter(r=>r.type==='dataset' && (r.title.toLowerCase().includes(q)||r.state.toLowerCase().includes(q)));
    document.getElementById('dh-results').innerHTML = dataHubList(items);
  });

function bindListSearches(){
  document.querySelectorAll('[data-list-search]').forEach(input=>{
    input.addEventListener('input', ()=>{
      const id = input.dataset.listId;
      const navConf = ROLE_NAV[state.role]||[];
      const item = navConf.find(n=>n.id===id);
      if(!item) return;
      const q = input.value.toLowerCase();
      const items = RESOURCES.filter(item.filter).filter(r=> !q || r.title.toLowerCase().includes(q) || r.state.toLowerCase().includes(q) || r.topic.toLowerCase().includes(q));
      const container = document.getElementById('list-container-'+id);
      if(container) container.innerHTML = resList(items);
    });
  });
}
function bindEvidenceTabs(){
  document.querySelectorAll('[data-action="evidence-tab"]').forEach(tab=>{

/* ================= GLOBAL EVENT DELEGATION ================= */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  switch(action){
    case 'close-modal': closeModal(); break;
    case 'help': e.preventDefault(); helpModal(); break;
    case 'tour': e.preventDefault(); tourModal(); break;
    case 'tour-next': e.preventDefault(); if (typeof window.currentTourStep !== 'undefined') showTourStep(window.currentTourStep + 1); break;
    case 'tour-prev': e.preventDefault(); if (typeof window.currentTourStep !== 'undefined') showTourStep(window.currentTourStep - 1); break;
    case 'hero-next': e.preventDefault(); if(window.heroNext) window.heroNext(); break;
    case 'hero-prev': e.preventDefault(); if(window.heroPrev) window.heroPrev(); break;
    case 'hero-dot': e.preventDefault(); if(window.heroDot) window.heroDot(parseInt(t.dataset.index)); break;
    case 'toggle-theme': {
      e.preventDefault();
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      try { localStorage.setItem('BhuSetu_theme', newTheme); } catch(e){}
      toast('Theme switched to ' + newTheme + ' mode');
      break;
    }
    case 'lang': {
      e.preventDefault();
      openModal(`
        <h2>Select Language</h2>
        <div class="grid grid-3">
          <button class="btn btn-outline" data-action="set-lang" data-lang="en">English</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="hi">हिंदी (Hindi)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="bn">বাংলা (Bengali)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="te">తెలుగు (Telugu)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="mr">मराठी (Marathi)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="ta">தமிழ் (Tamil)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="ur">اردو (Urdu)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="gu">ગુજરાતી (Gujarati)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="kn">ಕನ್ನಡ (Kannada)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="or">ଓଡ଼ିଆ (Odia)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="ml">മലയാളം (Malayalam)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="pa">ਪੰਜਾਬੀ (Punjabi)</button>
          <button class="btn btn-outline" data-action="set-lang" data-lang="as">অসমীয়া (Assamese)</button>
        </div>
      `);
      break;
    }
    case 'set-lang': {
      const langs = {'en':'English', 'hi':'हिंदी', 'bn':'বাংলা', 'te':'తెలుగు', 'mr':'मराठी', 'ta':'தமிழ்', 'ur':'اردو', 'gu':'ગુજરાતી', 'kn':'ಕನ್ನಡ', 'or':'ଓଡ଼ିଆ', 'ml':'മലയാളം', 'pa':'ਪੰਜਾਬੀ', 'as':'অসমীয়া'};
      state.lang = t.dataset.lang;
      saveState();
      
      if (state.lang === 'en') {
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=.' + location.hostname + '; path=/;';
        location.reload();
        break;
      }

      const select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = state.lang;
        select.dispatchEvent(new Event('change'));
        toast('Translating to ' + langs[state.lang] + '...');
        closeModal();
      } else {
        document.cookie = `googtrans=/en/${state.lang}; path=/`;
        document.cookie = `googtrans=/en/${state.lang}; domain=.${location.hostname}; path=/`;
        location.reload();
      }
      break;
    }
    case 'signout': {
      state.role=null; state.roleLabel=null; saveState(); toast('Signed out'); go('/'); render();
      break;
    }
    case 'choose-role': {
      const role = t.dataset.role, label = t.dataset.label;
      state.role = role; state.roleLabel = label; saveState();
      toast('Signed in as '+label);
      go('/dash/'+role+'/overview');
      break;
    }
    case 'open-resource': { e.preventDefault(); openResourceModal(t.dataset.id); break; }
    case 'toggle-save': {
      const id = t.dataset.id;
      const idx = state.saved.indexOf(id);
      if(idx>-1){ state.saved.splice(idx,1); toast('Removed from saved research'); }
      else { state.saved.push(id); toast('Saved to your research'); }
      saveState();
      const modalOpen = document.getElementById('modal-overlay');
      if(modalOpen) openResourceModal(id); else render();
      break;
    }
    case 'toggle-compare': {
      state.compareSet = state.compareSet||[];
      const id = t.dataset.id;
      const idx = state.compareSet.indexOf(id);
      if(idx>-1) state.compareSet.splice(idx,1);
      else { if(state.compareSet.length>=2) state.compareSet.shift(); state.compareSet.push(id); }
      render();
      break;
    }
    case 'toggle-policy-compare': {
      state.policyCompare = state.policyCompare||[];
      const id = t.dataset.id;
      const idx = state.policyCompare.indexOf(id);
      if(idx>-1) state.policyCompare.splice(idx,1);
      else { if(state.policyCompare.length>=2) state.policyCompare.shift(); state.policyCompare.push(id); }
      toast('Updated comparison selection'); render();
      break;
    }
    case 'clear-policy-compare': state.policyCompare=[]; render(); break;
    case 'download-demo': {
      const id = t.dataset.id;
      const r = RESOURCES.find(x=>x.id===id);
      const name = r? r.title : 'dataset';
      const csv = `id,title,state,year,topic\n${id},"${(name||'').replace(/"/g,'')}",${r?r.state:''},${r?r.year:''},${r?r.topic:''}\n`;
      const blob = new Blob([csv], {type:'text/csv'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = id+'-demo.csv';
      document.body.appendChild(a); a.click(); a.remove();
      toast('Downloaded demo file');
      break;
    }
    case 'open-challenge': e.preventDefault(); openChallengeModal(t.dataset.id); break;
    case 'open-policy': e.preventDefault(); openPolicyModal(t.dataset.id); break;
    case 'open-case': e.preventDefault(); openCaseModal(t.dataset.id); break;
    case 'copy-api': {
      const path = t.dataset.path;
      const url = 'https://api.BhuSetu.gov.in'+path;
      navigator.clipboard && navigator.clipboard.writeText(url).catch(()=>{});
      toast('Copied endpoint to clipboard');
      break;
    }
    case 'ai-ask': {
      const val = document.getElementById('ai-input').value.trim();
      if(val) runAiQuery(val); else toast('Type a question first');
      break;
    }
    case 'ai-example': {
      const q = t.dataset.q;
      const input = document.getElementById('ai-input');
      if(input) input.value = q;
      runAiQuery(q);
      break;
    }
    case 'save-idea': toast('Idea saved to your research'); break;
    case 'run-analysis': {
      const field = document.getElementById('analysis-indicator').value;
      document.getElementById('analysis-chart').innerHTML = districtBarChart(field);
      break;
    }
    case 'run-sim': {
      const p = document.getElementById('s-protect').value, u = document.getElementById('s-urban').value, f = document.getElementById('s-forest').value;
      document.getElementById('sim-results').innerHTML = simChart(+p,+u,+f);
      toast('Scenario updated');
      break;
    }
    case 'rh-tab': {
      document.querySelectorAll('#rh-tabs .tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      runResearchHub();
      break;
    }
    case 'gis-layer': break; /* handled by change listener below */
    case 'gis-select': gisSelectState(t.dataset.state); break;
    case 'gis-related-research': {
      go('/research?state='+encodeURIComponent(t.dataset.state));
      break;
    }
    case 'gis-reset': render(); break;
    case 'gis-download': {
      const csv = 'state,agLandPct,forestPct,urbanGrowth,waterStress\n'+DISTRICT_STATS.map(d=>`${d.state},${d.agLandPct},${d.forestPct},${d.urbanGrowth},${d.waterStress}`).join('\n');
      const blob = new Blob([csv],{type:'text/csv'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gis-layer-demo.csv'; document.body.appendChild(a); a.click(); a.remove();
      toast('Downloaded demo layer data');
      break;
    }
    case 'dh-preview': {
      const r = RESOURCES.find(x=>x.id===t.dataset.id);
      openModal(`<h2>Preview \u2014 ${r.title}</h2><table class="data-table"><thead><tr><th>district</th><th>year</th><th>value</th></tr></thead><tbody>${[1,2,3,4,5].map(i=>`<tr><td>${r.state.split(' ')[0]} Dist. ${i}</td><td>${r.year}</td><td>${Math.round(seedRand(i+r.id.length)*100)}</td></tr>`).join('')}</tbody></table><p class="skeleton-note" style="margin-top:10px">Demo preview rows.</p>`);
      break;
    }
    case 'dh-metadata': {
      const r = RESOURCES.find(x=>x.id===t.dataset.id);
      openModal(`<h2>Metadata \u2014 ${r.title}</h2><div class="kv-list"><div><div class="k">Source</div><div class="v">${r.source}</div></div><div><div class="k">Coverage</div><div class="v">${r.state}</div></div><div><div class="k">Period</div><div class="v">${r.year}</div></div><div><div class="k">Format</div><div class="v">CSV, GeoJSON</div></div><div><div class="k">Update frequency</div><div class="v">Annual</div></div><div><div class="k">Access level</div><div class="v">Public (demo)</div></div></div>`);
      break;
    }
    case 'dh-api': {
      const r = RESOURCES.find(x=>x.id===t.dataset.id);
      openModal(`<h2>API access \u2014 ${r.title}</h2><code style="display:block;background:var(--ivory-200);padding:10px 12px;border-radius:4px;font-size:12.5px">GET https://api.BhuSetu.gov.in/v1/datasets/${r.id}</code><p class="field-hint">Demo endpoint for illustration.</p>`);
      break;
    }
  }
});

document.addEventListener('change', function(e){
  const t = e.target.closest('[data-action="gis-layer"]');
  if(t){
    const label = GIS_LAYERS.find(l=>l.id===t.value);
    document.getElementById('state-grid').innerHTML = gisStateGrid(t.value);
    const legendTitle = document.querySelector('.map-legend div');
    if(legendTitle) legendTitle.textContent = label.label;
  }
  if(e.target.matches('#rh-state,#rh-topic,#rh-year')) runResearchHub();
});
document.addEventListener('input', function(e){
  if(e.target.id==='rh-search') runResearchHub();
});

document.addEventListener('submit', function(e){
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;
  const data = Object.fromEntries(new FormData(form).entries());
  if(type==='collab'){
    state.collabRequests.push(data); saveState(); toast('Collaboration request sent'); render();
  } else if(type==='research-request'){
    state.researchRequests.push(data); saveState(); toast('Research request submitted'); render();
  } else if(type==='submit-idea'){
    state.submissions.push({title:data.title, desc:data.desc, challengeTitle:form.dataset.challengeTitle, date:new Date().toISOString().slice(0,10)});
    saveState(); closeModal(); toast('Idea submitted for review');
  } else if(type==='gap-finder'){
    runGapFinder(data.topic, data.geo, data.period);
  } else if(type==='policy-design'){
    document.getElementById('policy-design-out').innerHTML = `<div class="panel"><h3>Draft saved</h3><p class="panel-sub">This design is stored for this session (demo).</p>
      <div class="kv-list"><div><div class="k">Problem</div><div class="v">${escapeHtml(data.problem)}</div></div><div><div class="k">Geography</div><div class="v">${data.geo}</div></div><div><div class="k">Target population</div><div class="v">${escapeHtml(data.target)}</div></div><div><div class="k">Intervention</div><div class="v">${escapeHtml(data.intervention)}</div></div><div><div class="k">Expected outcome</div><div class="v">${escapeHtml(data.outcome)}</div></div><div><div class="k">Key indicator</div><div class="v">${escapeHtml(data.indicator)}</div></div></div>
      <a class="btn btn-outline btn-sm" href="#/policy-lab/simulator">Test in simulator \u2192</a></div>`;
    toast('Policy design saved');
  }
});
</script>
